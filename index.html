<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>朝</title>
<style>
  :root{
    --bg:#070510; --panel:rgba(18,10,38,.72); --panel2:rgba(34,18,66,.6);
    --cyan:#00f0ff; --magenta:#ff2d95; --green:#39ff14; --yellow:#f9f002;
    --text:#e8f6ff; --sub:#8a7fc0; --line:rgba(0,240,255,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:"Courier New",ui-monospace,"Hiragino Sans",monospace;
    color:var(--text); min-height:100vh; padding:20px 16px 60px; position:relative;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(255,45,149,.18), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, rgba(0,240,255,.16), transparent 60%),
      linear-gradient(var(--bg),#0a0618);
    background-attachment:fixed;
  }
  body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,45,149,.05) 1px,transparent 1px);
    background-size:40px 40px;}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.14) 2px 4px);}
  .wrap{max-width:520px; margin:0 auto; position:relative; z-index:2;}
  h1{font-size:30px; text-align:center; margin:8px 0 2px; letter-spacing:6px; font-weight:900;
    color:#fff; text-shadow:0 0 8px var(--cyan),0 0 20px var(--cyan),0 0 2px #fff;}
  .tagline{text-align:center; color:var(--magenta); margin:0 0 6px; font-size:13px; letter-spacing:2px;
    text-shadow:0 0 8px rgba(255,45,149,.7);}
  a.homelink{display:block; text-align:center; color:var(--cyan); font-size:12px; margin:6px 0 16px;
    text-decoration:none; letter-spacing:2px; text-shadow:0 0 6px rgba(0,240,255,.6);}

  .tabs{display:flex; gap:10px; margin-bottom:16px;}
  .tab{flex:1; padding:11px; border:1px solid var(--line); border-radius:4px; cursor:pointer;
    background:var(--panel); color:var(--sub); font-size:14px; font-weight:700; letter-spacing:2px;
    font-family:inherit; text-transform:uppercase;}
  .tab.active{color:#fff; border-color:var(--magenta);
    box-shadow:0 0 12px rgba(255,45,149,.6), inset 0 0 12px rgba(255,45,149,.25);
    text-shadow:0 0 8px var(--magenta);}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px;
    margin-bottom:14px; backdrop-filter:blur(3px);
    box-shadow:0 0 20px rgba(0,240,255,.10), inset 0 0 30px rgba(0,240,255,.04);}
  .date{text-align:center; color:var(--cyan); font-size:13px; margin-bottom:14px; letter-spacing:2px;}

  .step{display:flex; align-items:center; gap:12px; background:var(--panel2);
    border:1px solid rgba(255,45,149,.18); border-radius:4px; padding:6px 10px; margin-bottom:12px; transition:.2s;}
  .step.done{border-color:var(--green); box-shadow:0 0 12px rgba(57,255,20,.3); background:rgba(57,255,20,.08);}
  .num{width:34px; height:34px; flex:none; border-radius:4px; background:transparent; border:1px solid var(--cyan);
    color:var(--cyan); font-weight:800; display:flex; align-items:center; justify-content:center;
    text-shadow:0 0 6px var(--cyan);}
  .step.done .num{border-color:var(--green); color:var(--green); text-shadow:0 0 6px var(--green);}
  .step input{flex:1; background:transparent; border:none; color:var(--text); font-family:inherit;
    font-size:16px; padding:12px 4px; outline:none; min-width:0;}
  .step.done input{text-decoration:line-through; color:var(--sub);}
  .check{width:40px; height:40px; flex:none; border-radius:4px; border:1px solid #4a3d78;
    background:transparent; cursor:pointer; font-size:20px; color:transparent; font-family:inherit;}
  .step.done .check{background:var(--green); border-color:var(--green); color:#07120a;
    box-shadow:0 0 12px rgba(57,255,20,.6);}

  .progress{height:12px; background:var(--panel2); border:1px solid var(--line); border-radius:3px;
    overflow:hidden; margin:6px 0 16px;}
  .bar{height:100%; width:0; background:linear-gradient(90deg,var(--magenta),var(--cyan));
    box-shadow:0 0 12px var(--cyan); transition:width .4s;}

  .btn{width:100%; padding:14px; border:1px solid var(--magenta); border-radius:5px; font-size:15px;
    font-weight:800; cursor:pointer; background:transparent; color:#fff; font-family:inherit; letter-spacing:2px;
    text-transform:uppercase; text-shadow:0 0 8px var(--magenta); box-shadow:0 0 12px rgba(255,45,149,.35);}
  .btn.ghost{border-color:var(--line); color:var(--sub); text-shadow:none; box-shadow:none;}
  .btn:disabled{opacity:.35; box-shadow:none;}
  .row{display:flex; gap:8px; margin-top:8px;}

  .clear-banner{display:none; text-align:center; padding:22px; border-radius:6px; margin-bottom:14px;
    border:1px solid var(--cyan); background:linear-gradient(135deg,rgba(255,45,149,.25),rgba(0,240,255,.25));
    box-shadow:0 0 30px rgba(0,240,255,.5); animation:pop .4s;}
  .clear-banner.show{display:block;}
  .clear-banner .big{font-size:40px; font-weight:900; letter-spacing:4px; text-shadow:0 0 16px var(--cyan);}
  @keyframes pop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

  .hist-day{background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:12px 14px; margin-bottom:10px;}
  .hist-day .d{font-weight:700; margin-bottom:6px; color:var(--cyan); letter-spacing:1px;}
  .hist-day .s{color:var(--sub); font-size:14px; padding:2px 0;}
  .empty{text-align:center; color:var(--sub); padding:30px 0;}
  .stat{display:flex; gap:10px; margin-bottom:14px;}
  .stat .box{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:14px; text-align:center;}
  .stat .n{font-size:28px; font-weight:900; color:var(--yellow); text-shadow:0 0 10px rgba(249,240,2,.6);}
  .stat .l{font-size:11px; color:var(--sub); letter-spacing:1px;}
  .hidden{display:none;}
  .cal{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:14px; box-shadow:0 0 20px rgba(0,240,255,.10), inset 0 0 30px rgba(0,240,255,.04); backdrop-filter:blur(3px);}
  .cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .cal-head button{background:var(--panel2); border:1px solid var(--magenta); color:var(--magenta); padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:700;}
  .cal-m{color:var(--cyan); font-size:18px; font-weight:800; text-shadow:0 0 8px var(--cyan);}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
  .cal-w{text-align:center; color:var(--sub); font-size:12px; padding-bottom:8px;}
  .cal-d{aspect-ratio:1; display:flex; flex-direction:column; justify-content:center; align-items:center; border:1px solid var(--line); border-radius:4px; font-size:14px; color:var(--text); background:var(--panel2);}
  .cal-d.none{border-color:transparent; background:transparent; pointer-events:none;}
  .cal-d.clear{border-color:var(--green); background:rgba(57,255,20,.1); box-shadow:0 0 8px rgba(57,255,20,.2);}
  .cal-d.part{border-color:var(--yellow); background:rgba(249,240,2,.1);}
  .cal-d .n{font-weight:700;}
  .cal-d .m{font-size:12px; margin-top:2px; line-height:1; min-height:12px;}
  .cal-rate{text-align:center; margin-top:16px; font-size:18px; font-weight:900; color:var(--magenta); text-shadow:0 0 10px rgba(255,45,149,.5);}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="朝">
<meta name="theme-color" content="#070510">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="robots" content="noindex, nofollow">

<style>
  /* 全画面アプリとして開くと、上はノッチ・下はホームバーに潜り込む。
     body ではなく html に余白を持たせるので、元のレイアウトを壊さない。
     position:fixed で組んだ画面には効かないので、その場合は自分で
     env(safe-area-inset-*) を足すこと */
  @supports (padding: env(safe-area-inset-top)) {
    html {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background: #070510;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>朝</h1>
  <p class="tagline">MORNING PROTOCOL // 3 STEPS TO CLEAR</p>
  <a class="homelink" href="todo.html" onclick="return goApp(event,'todo.html')">▶ TASK LIST システムへ</a>

  <div style="text-align:center;margin:-8px 0 12px;">
    <button id="msSyncBtn" onclick="msOpenSync()" style="background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-family:inherit;font-size:12px;letter-spacing:1px;padding:6px 12px;border-radius:20px;cursor:pointer;">☁️ 同期せってい</button>
    <button onclick="msExport()" style="background:transparent;border:1px solid var(--green);color:var(--green);font-family:inherit;font-size:12px;letter-spacing:1px;padding:6px 12px;border-radius:20px;cursor:pointer;margin-left:6px;">⬇️ バックアップ</button>
    <button onclick="msTriggerImport()" style="background:transparent;border:1px solid var(--yellow);color:var(--yellow);font-family:inherit;font-size:12px;letter-spacing:1px;padding:6px 12px;border-radius:20px;cursor:pointer;margin-left:6px;">⬆️ 復元</button>
    <input type="file" id="msBackupFile" accept="application/json,.json" style="display:none" onchange="msImport(this)">
    <br><span id="msSyncStatus" style="color:var(--sub);font-size:11px;display:inline-block;margin-top:6px;"></span>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabToday" onclick="switchTab('today')">きょう</button>
    <button class="tab" id="tabHist" onclick="switchTab('hist')">きろく</button>
    <button class="tab" id="tabCal" onclick="switchTab('cal')">カレンダー</button>
  </div>

  <div id="viewToday">
    <div class="clear-banner" id="banner">
      <div class="big">🎉 CLEAR!</div>
      <div>今日の3つ、ぜんぶできた！</div>
    </div>
    <div class="card">
      <div class="date" id="today"></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div id="steps"></div>
      <div class="row">
        <button class="btn ghost" onclick="resetToday()">リセット</button>
        <button class="btn" id="saveBtn" onclick="saveToday()">きろくする</button>
      </div>
    </div>
  </div>

  <div id="viewHist" class="hidden">
    <div class="stat">
      <div class="box"><div class="n" id="statClear">0</div><div class="l">クリアした日</div></div>
      <div class="box"><div class="n" id="statStreak">0</div><div class="l">連続クリア🔥</div></div>
      <div class="box"><div class="n" id="statTotal">0</div><div class="l">できた合計</div></div>
    </div>
    <div id="histList"></div>
  </div>

  <div id="viewCal" class="hidden">
    <div class="cal">
      <div class="cal-head">
        <button onclick="calMove(-1)">◀</button>
        <div class="cal-m" id="calMonth"></div>
        <button onclick="calMove(1)">▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-rate" id="calRate"></div>
    </div>
  </div>
</div>

<div id="msSyncWrap" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)msCloseSync()">
  <div style="background:var(--bg);border:1px solid var(--cyan);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 0 30px rgba(0,240,255,.4);">
    <div style="color:var(--cyan);font-weight:800;margin-bottom:12px;">☁️ クラウド同期（朝アプリ）</div>
    <input id="msUrl" placeholder="Supabase URL（https://xxxx.supabase.co）" style="width:100%;box-sizing:border-box;background:#12101e;border:1px solid var(--sub);color:var(--text);padding:10px;border-radius:8px;margin-bottom:8px;font-family:inherit;">
    <input id="msKey" type="password" placeholder="キー（sb_publishable_… でOK）" style="width:100%;box-sizing:border-box;background:#12101e;border:1px solid var(--sub);color:var(--text);padding:10px;border-radius:8px;margin-bottom:8px;font-family:inherit;">
    <input id="msCode" placeholder="同期コード（他と別の合言葉）" style="width:100%;box-sizing:border-box;background:#12101e;border:1px solid var(--sub);color:var(--text);padding:10px;border-radius:8px;font-family:inherit;">
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button onclick="msCloseSync()" style="flex:1;background:transparent;border:1px solid var(--sub);color:var(--sub);padding:10px;border-radius:8px;font-family:inherit;cursor:pointer;">とじる</button>
      <button onclick="msSaveSync()" style="flex:1;background:var(--cyan);border:none;color:#000;padding:10px;border-radius:8px;font-family:inherit;font-weight:800;cursor:pointer;">保存して同期</button>
    </div>
    <div id="msSyncMsg" style="color:var(--sub);font-size:11px;margin-top:10px;"></div>
    <div style="color:var(--sub);font-size:11px;margin-top:6px;line-height:1.6;">todoと<b>同じURL・キー</b>でOK。<b>同期コードだけ別</b>に（例：<b>sian-morning-2026</b>）。3つ入れると自動で消えなくなります。</div>
  </div>
</div>

<script>
const KEY_TODAY="ts_today", KEY_HIST="ts_history";
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function niceDate(s){const d=new Date(s+"T00:00");const w=["日","月","火","水","木","金","土"];return `${d.getMonth()+1}月${d.getDate()}日(${w[d.getDay()]})`;}
let state=load();
function load(){
  const raw=localStorage.getItem(KEY_TODAY);
  if(raw){const o=JSON.parse(raw); if(o.date===todayStr()) return o;}
  return {date:todayStr(), steps:[{t:"",d:false},{t:"",d:false},{t:"",d:false}]};
}
function persist(){localStorage.setItem(KEY_TODAY,JSON.stringify(state)); if(typeof msTouch==='function') msTouch();}
function render(){
  document.getElementById("today").textContent=niceDate(state.date);
  const c=document.getElementById("steps"); c.innerHTML="";
  state.steps.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="step"+(s.d?" done":"");
    div.innerHTML=`
      <div class="num">${i+1}</div>
      <input placeholder="やりたいこと ${i+1}" value="${s.t.replace(/"/g,'&quot;')}" oninput="edit(${i},this.value)">
      <button class="check" onclick="toggle(${i})">✓</button>`;
    c.appendChild(div);
  });
  const done=state.steps.filter(s=>s.d).length;
  document.getElementById("bar").style.width=(done/3*100)+"%";
  const all=done===3;
  document.getElementById("banner").classList.toggle("show",all);
  document.getElementById("saveBtn").disabled=done===0;
  persist();
}
function edit(i,v){state.steps[i].t=v; persist();}
function toggle(i){
  const wasAll=state.steps.filter(s=>s.d).length===3;
  state.steps[i].d=!state.steps[i].d; render();
  if(!wasAll && state.steps.filter(s=>s.d).length===3) celebrate();
}
function celebrate(){
  if(window.sfxReward)window.sfxReward();
  const emojis=["🎉","⭐","✨","🎊","💫","⚡"];
  for(let k=0;k<24;k++){
    const e=document.createElement("div");
    e.textContent=emojis[k%emojis.length];
    e.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-30px;font-size:${16+Math.random()*20}px;pointer-events:none;z-index:99;transition:transform 1.6s ease-in, opacity 1.6s;`;
    document.body.appendChild(e);
    requestAnimationFrame(()=>{e.style.transform=`translateY(105vh) rotate(${Math.random()*360}deg)`;e.style.opacity=0;});
    setTimeout(()=>e.remove(),1700);
  }
}
function resetToday(){
  if(!confirm("今日の3つを消していい？"))return;
  state={date:todayStr(), steps:[{t:"",d:false},{t:"",d:false},{t:"",d:false}]};
  render();
}
function saveToday(){
  const hist=JSON.parse(localStorage.getItem(KEY_HIST)||"[]");
  const done=state.steps.filter(s=>s.d);
  const entry={date:state.date, cleared:done.length===3,
    steps:state.steps.filter(s=>s.t||s.d).map(s=>({t:s.t||"(名前なし)",d:s.d}))};
  const idx=hist.findIndex(h=>h.date===state.date);
  if(idx>=0)hist[idx]=entry; else hist.push(entry);
  localStorage.setItem(KEY_HIST,JSON.stringify(hist)); if(typeof msTouch==='function') msTouch();
  const b=document.getElementById("saveBtn");
  b.textContent="✓ きろくした！"; setTimeout(()=>b.textContent="きろくする",1400);
}
function goApp(e,url){ e.preventDefault(); if(window.sfxWarp)window.sfxWarp(); setTimeout(()=>location.href=url,280); return false; }
function switchTab(t){
  const today=t==="today", hist=t==="hist", cal=t==="cal";
  document.getElementById("viewToday").classList.toggle("hidden",!today);
  document.getElementById("viewHist").classList.toggle("hidden",!hist);
  if(document.getElementById("viewCal")) document.getElementById("viewCal").classList.toggle("hidden",!cal);
  document.getElementById("tabToday").classList.toggle("active",today);
  document.getElementById("tabHist").classList.toggle("active",hist);
  if(document.getElementById("tabCal")) document.getElementById("tabCal").classList.toggle("active",cal);
  if(hist)renderHist();
  if(cal)renderCalInit();
}
let calDate = new Date();
function renderCalInit(){
  calDate = new Date();
  renderCal();
}
function calMove(m){
  calDate.setMonth(calDate.getMonth()+m);
  renderCal();
}
function renderCal(){
  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  document.getElementById("calMonth").textContent = `${y}年 ${m+1}月`;
  const hist = JSON.parse(localStorage.getItem(KEY_HIST)||"[]");
  const histMap = {};
  hist.forEach(h => { histMap[h.date] = h; });
  const grid = document.getElementById("calGrid");
  const weeks = ["日","月","火","水","木","金","土"];
  let html = weeks.map(w => `<div class="cal-w">${w}</div>`).join("");
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  for(let i=0; i<firstDay; i++) html += `<div class="cal-d none"></div>`;
  let clearedDays = 0;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const h = histMap[dateStr];
    let cls = "cal-d", mark = "";
    if(h){
      if(h.cleared){ cls += " clear"; mark = "🏆"; clearedDays++; }
      else { cls += " part"; mark = "✅"; }
    }
    html += `<div class="${cls}"><div class="n">${d}</div><div class="m">${mark}</div></div>`;
  }
  grid.innerHTML = html;
  const rate = Math.round((clearedDays / daysInMonth) * 100) || 0;
  document.getElementById("calRate").textContent = `月間達成率: ${rate}% (${clearedDays}/${daysInMonth}日)`;
}
function renderHist(){
  const hist=JSON.parse(localStorage.getItem(KEY_HIST)||"[]").sort((a,b)=>b.date<a.date?-1:1);
  const list=document.getElementById("histList");
  const clears=hist.filter(h=>h.cleared).length;
  const total=hist.reduce((n,h)=>n+h.steps.filter(s=>s.d).length,0);
  document.getElementById("statClear").textContent=clears;
  document.getElementById("statTotal").textContent=total;
  document.getElementById("statStreak").textContent=streak(hist);
  if(!hist.length){list.innerHTML='<div class="empty">まだ記録がないよ。<br>今日の3つをやってみよう！</div>';return;}
  list.innerHTML="";
  hist.forEach(h=>{
    const div=document.createElement("div"); div.className="hist-day";
    div.innerHTML=`<div class="d">${niceDate(h.date)} ${h.cleared?"🏆 クリア":""}</div>`+
      h.steps.map(s=>`<div class="s">${s.d?"✅":"⬜️"} ${s.t}</div>`).join("");
    list.appendChild(div);
  });
}
function streak(hist){
  const cleared=new Set(hist.filter(h=>h.cleared).map(h=>h.date));
  let n=0; let d=new Date();
  while(true){
    const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(cleared.has(s)){n++; d.setDate(d.getDate()-1);}
    else break;
  }
  return n;
}
/* ================= クラウド同期 (Supabase) ================= */
/* 設定は今まで通り URL・キー・同期コードの3つ（既存の設定がそのまま使える）。
   中身だけ「1日ずつ突き合わせて、押さずに自動で揃う」方式に作り替えた。
   履歴は date を背番号にして、日ごとに新しい方を残す＝2台で書いても消えない。
   今日の入力中(ts_today)は端末ローカル。きろくすると履歴になって同期される。 */
const MS_SB={url:()=>localStorage.getItem("ms_sb_url")||"",key:()=>localStorage.getItem("ms_sb_key")||"",code:()=>localStorage.getItem("ms_sb_code")||""};
function msSyncOn(){return MS_SB.url()&&MS_SB.key()&&MS_SB.code();}
function msSetStatus(t){const s=document.getElementById("msSyncStatus"); if(s)s.textContent=t;}
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const jset=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};

// 履歴を date→{cleared,steps} の地図で持つ／各日の更新時刻
function histMap(){ const m={}; JSON.parse(localStorage.getItem(KEY_HIST)||"[]").forEach(h=>m[h.date]={cleared:!!h.cleared,steps:h.steps||[]}); return m; }
function dayU(){ return jget("asa_day_u",{}); }
function histSnap(){ return jget("asa_hist_snap",{}); }
const entryStr=e=>JSON.stringify([e.cleared?1:0, e.steps]);

let msSyncing=false, msPending=false, msLastSeen=JSON.stringify(histMap());

async function msPull(){
  const r=await fetch(`${MS_SB.url()}/rest/v1/sync?code=eq.${encodeURIComponent(MS_SB.code())}&select=data`,
    {headers:{apikey:MS_SB.key(),Authorization:"Bearer "+MS_SB.key()}});
  if(!r.ok) throw new Error("取得"+r.status);
  const rows=await r.json();
  const data=rows[0]&&rows[0].data;
  if(!data) return {days:{}};
  if(data.days) return data;                       // 新しい形式
  // 旧アプリの形式 {today, hist, ts} を、日ごとの形へ変換して読み込む（引っ越し救済）
  try{
    const arr=typeof data.hist==="string"?JSON.parse(data.hist||"[]"):(data.hist||[]);
    const u=Number(data.ts)||Date.now(), days={};
    arr.forEach(h=>{ if(h&&h.date) days[h.date]={cleared:h.cleared?1:0,steps:h.steps||[],u}; });
    return {days};
  }catch(e){ return {days:{}}; }
}
async function msPush(blob){
  const body=[{code:MS_SB.code(),data:blob,updated_at:new Date().toISOString()}];
  const r=await fetch(`${MS_SB.url()}/rest/v1/sync?on_conflict=code`,{method:"POST",
    headers:{apikey:MS_SB.key(),Authorization:"Bearer "+MS_SB.key(),"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error("保存"+r.status);
}

async function msSync(manual){
  if(!msSyncOn()){ if(manual) msOpenSync(); return; }
  if(!navigator.onLine){ msSetStatus("⚠ オフライン（あとで同期）"); return; }
  if(msSyncing){ msPending=true; return; }
  msSyncing=true;
  try{
    // 送る前に、手元で変わった日に新しい時刻を打つ
    const cur=histMap(), snap=histSnap(), u=dayU(), t=Date.now();
    Object.keys(cur).forEach(d=>{ if(snap[d]!==entryStr(cur[d])||!u[d]) u[d]=t; });

    const remote=await msPull(), rdays=remote.days||{};
    // 日ごとに新しい方を残す（消える心配なし＝履歴は上書き/追加のみ）
    const merged={}, mu={};
    new Set([...Object.keys(cur),...Object.keys(rdays)]).forEach(d=>{
      const lu=u[d]||0, ru=(rdays[d]&&rdays[d].u)||0;
      if(rdays[d] && ru>lu){ merged[d]={cleared:!!rdays[d].cleared,steps:rdays[d].steps||[]}; mu[d]=ru; }
      else if(cur[d]){ merged[d]=cur[d]; mu[d]=lu||t; }
      else if(rdays[d]){ merged[d]={cleared:!!rdays[d].cleared,steps:rdays[d].steps||[]}; mu[d]=ru; }
    });

    // 手元へ反映
    const arr=Object.keys(merged).sort().map(d=>({date:d,cleared:merged[d].cleared,steps:merged[d].steps}));
    localStorage.setItem(KEY_HIST,JSON.stringify(arr));
    jset("asa_day_u",mu);
    const ns={}; Object.keys(merged).forEach(d=>ns[d]=entryStr(merged[d])); jset("asa_hist_snap",ns);

    // サーバーへ揃った状態を返す
    const blob={v:2,days:{}};
    Object.keys(merged).forEach(d=>blob.days[d]={cleared:merged[d].cleared?1:0,steps:merged[d].steps,u:mu[d]});
    await msPush(blob);

    msLastSeen=JSON.stringify(histMap());
    try{renderHist();}catch(e){}
    try{ if(document.getElementById("viewCal")&&!document.getElementById("viewCal").classList.contains("hidden")) renderCal(); }catch(e){}
    msSetStatus("✓ 同期 "+hhmm());
  }catch(e){ msSetStatus(manual?("⚠ 同期エラー: "+(e.message||e)):"⚠ オフライン"); }
  finally{ msSyncing=false; if(msPending){msPending=false; setTimeout(()=>msSync(false),60);} }
}

// 記録が変わったら送る（今日の入力中は履歴が変わらないので送られない＝無駄打ちしない）
function msCheck(){ if(msSyncOn() && JSON.stringify(histMap())!==msLastSeen) msSync(false); }
function msTouch(){ if(msSyncOn()) setTimeout(msCheck,400); }   // saveToday から呼ばれる

function msOpenSync(){ document.getElementById("msUrl").value=MS_SB.url(); document.getElementById("msKey").value=MS_SB.key(); document.getElementById("msCode").value=MS_SB.code(); document.getElementById("msSyncMsg").textContent=""; document.getElementById("msSyncWrap").style.display="flex"; }
function msCloseSync(){ document.getElementById("msSyncWrap").style.display="none"; }
function msSaveSync(){
  localStorage.setItem("ms_sb_url",document.getElementById("msUrl").value.trim().replace(/\/$/,""));
  localStorage.setItem("ms_sb_key",document.getElementById("msKey").value.trim());
  localStorage.setItem("ms_sb_code",document.getElementById("msCode").value.trim());
  msCloseSync();
  if(msSyncOn()){ msSetStatus("☁️ つなぎました"); msSync(true); } else msSetStatus("この端末に保存中（同期オフ）");
}
/* ---- バックアップ / 復元 ---- */
function msExport(){
  const data={_app:"three-steps-morning",_ver:1,_exportedAt:new Date().toISOString(),ts_today:localStorage.getItem("ts_today"),ts_history:localStorage.getItem("ts_history")};
  let n=0; try{n=JSON.parse(data.ts_history||"[]").length;}catch(e){}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u; a.download=`asa-backup-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000);
  msSetStatus(`⬇️ バックアップ書き出し（記録 ${n}日）`);
}
function msTriggerImport(){ document.getElementById("msBackupFile").click(); }
async function msImport(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!data||data._app!=="three-steps-morning"){ if(!confirm("これは朝アプリのバックアップじゃないかも。読み込む？")){input.value="";return;} }
      if(!confirm("このバックアップで今の記録を置きかえます。よろしい？")){input.value="";return;}
      if(data.ts_today!=null)localStorage.setItem("ts_today",data.ts_today);
      if(data.ts_history!=null)localStorage.setItem("ts_history",data.ts_history);
      // 復元した各日に新しい時刻を打つ＝同期していれば、この端末の内容が正としてクラウドへ上がる
      try{ const arr=JSON.parse(data.ts_history||"[]"), u={}, t=Date.now();
        arr.forEach(h=>{ if(h&&h.date) u[h.date]=t; }); jset("asa_day_u",u); localStorage.removeItem("asa_hist_snap"); }catch(e){}
      input.value="";
      if(msSyncOn()){ try{await msSync(false);}catch(e){} }
      alert("復元しました！画面を更新します。"); location.reload();
    }catch(e){ alert("読み込み失敗："+e.message); input.value=""; }
  };
  rd.readAsText(f);
}
render();

/* ---- 起動と自動同期（押さずに揃う） ---- */
if(msSyncOn()){ msSetStatus("☁️ 同期ON"); msSync(false); } else msSetStatus("この端末に保存中（同期オフ）");
setInterval(msCheck,3000);                                   // 手元の変化を送る
document.addEventListener("click",()=>setTimeout(msCheck,400),true);
addEventListener("online",()=>msSync(false));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") msSync(false); });
setInterval(()=>{ if(document.visibilityState==="visible"&&msSyncOn()&&navigator.onLine) msSync(false); },15000); // 相手の変化を取りに行く

/* ---- 直したコードをiPhoneへ確実に届ける（版照合で自動reload） ---- */
const APP_VERSION="2026-08-07-3";
(function(){ const e=document.createElement("div"); e.textContent="v"+APP_VERSION;
  e.style.cssText="text-align:center;color:#3a3550;font-size:10px;padding:16px 0 26px;letter-spacing:.05em";
  document.body.appendChild(e); })();
let msVerChecking=false;
async function msCheckVersion(){
  if(msVerChecking||!navigator.onLine)return; msVerChecking=true;
  try{ const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});
    if(r.ok){ const v=(await r.text()).trim();
      if(v&&v!==APP_VERSION&&sessionStorage.getItem("reloaded_for")!==v){ sessionStorage.setItem("reloaded_for",v); location.reload(); } } }
  catch(e){} finally{ msVerChecking=false; }
}
msCheckVersion();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") msCheckVersion(); });
setInterval(()=>{ if(msSyncOn()&&!document.hidden)msPullNow(); },20000);

/* ---- サイバーパンク電子音 (Web Audio) ---- */
(function(){
  let ac;
  function ctx(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume(); return ac; }
  function tone(f0,f1,dur,type,vol){
    const a=ctx(),t=a.currentTime;
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1||f0),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  window.sfxClick=function(){ tone(240,90,0.08,"square",0.12); tone(1200,1600,0.03,"sawtooth",0.05); };
  window.sfxCheck=function(){ tone(520,1040,0.10,"square",0.14); setTimeout(()=>tone(1040,1560,0.08,"triangle",0.10),40); };
  window.sfxReward=function(){
    const n=[440,660,880,1320,1760];
    n.forEach((f,i)=>setTimeout(()=>tone(f,f*1.5,0.18,"sawtooth",0.14),i*70));
    setTimeout(()=>tone(2000,120,0.35,"square",0.10),n.length*70);
  };
  window.sfxWarp=function(){
    tone(220,1500,0.26,"sawtooth",0.12);
    tone(1500,400,0.30,"square",0.08,0.12);
    tone(700,1900,0.20,"triangle",0.06,0.20);
  };
  document.addEventListener("click",function(e){
    const b=e.target.closest("button"); if(!b)return;
    if(b.classList.contains("check")) window.sfxCheck(); else window.sfxClick();
  });
})();
